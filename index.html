<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanha | Product Engineer Portfolio & Projects</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            background-color: #0a0a0a; 
            color: #ffffff;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { font-size: 1.8rem; margin-bottom: 8px; font-weight: 700; letter-spacing: -0.5px; }
        p { color: #888888; font-size: 0.95rem; margin-bottom: 30px; }
        .links-wrapper { display: flex; flex-direction: column; gap: 16px; }
        .btn { 
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%; 
            padding: 16px; 
            text-align: center; 
            background: #111111; 
            color: #ffffff; 
            text-decoration: none; 
            border-radius: 12px; 
            font-weight: 600; 
            font-size: 1rem;
            border: 1px solid #333333;
            transition: all 0.2s ease;
        }
        .btn:hover { 
            background: #ffffff; 
            color: #000000; 
            border-color: #ffffff;
            transform: translateY(-2px);
        }
        .btn-primary {
            background: #0070f3;
            border-color: #0070f3;
        }
        .btn-primary:hover {
            background: #0051bb;
            border-color: #0051bb;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kanha</h1>
        <p>Product Engineer // Project Deployments</p>
        
        <div class="links-wrapper">
            <!-- Link 1: Main Portfolio -->
            <a class="btn btn-primary" href="https://vercel.app" target="_blank">
                Visit Main Portfolio
            </a>
            
            <!-- Link 2: Sector Guard Application -->
            <a class="btn" href="https://vercel.app" target="_blank">
                Sector Guard (Admin Dashboard)
            </a>
        </div>
    </div>
</body>
</html>
